[package]
name = "windowstash-companion"
version = "0.6.1"
description = "WindowStash menu bar launcher"
edition = "2021"

[lib]
name = "windowstash_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
windowstash-native-host = { path = "../native-host" }
serde_json = "1"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-positioner = { version = "2.3.4", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
