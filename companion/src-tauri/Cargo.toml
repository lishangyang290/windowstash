[package]
name = "windowstash-companion"
version = "0.2.0"
description = "WindowStash menu bar launcher"
edition = "2021"

[lib]
name = "windowstash_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-positioner = { version = "2.3.4", features = ["tray-icon"] }
