<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>标签页</title>
    <link id="lazy-tab-favicon" rel="icon" href="/lazy-favicon.svg" />
    <style>
      body { margin: 0; background: #fff; color: #27272a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { box-sizing: border-box; display: grid; min-height: 100vh; padding: 28vh 24px 0; place-content: start center; justify-items: center; gap: 12px; text-align: center; }
      main:empty { display: none; }
      strong { font-size: 18px; }
      p { margin: 4px 0 8px; color: #71717a; font-size: 14px; }
      button { min-width: 150px; border: 1px solid #d4d4d8; border-radius: 7px; background: #fff; color: #27272a; padding: 9px 14px; font-size: 13px; font-weight: 600; }
      button:hover { background: #f4f4f5; }
      .original-site { width: min(420px, calc(100vw - 48px)); margin-top: 6px; color: #71717a; font-size: 12px; text-align: center; }
      .original-site a { display: block; overflow: hidden; color: #2563eb; text-overflow: ellipsis; white-space: nowrap; }
      .original-site a:hover { color: #1d4ed8; text-decoration: underline; }
      @media (prefers-color-scheme: dark) {
        body { background: #202124; color: #e8eaed; }
        p { color: #9aa0a6; }
        button { border-color: #5f6368; background: #202124; color: #e8eaed; }
        button:hover { background: #303134; }
        .original-site { color: #9aa0a6; }
        .original-site a { color: #8ab4f8; }
        .original-site a:hover { color: #aecbfa; }
      }
    </style>
  </head>
  <body>
    <main id="recovery"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
