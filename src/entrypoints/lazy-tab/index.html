<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WindowStash</title>
    <style>
      body { margin: 0; background: #fff; color: #27272a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { display: grid; min-height: 100vh; place-content: center; justify-items: center; gap: 12px; text-align: center; }
      main:empty { display: none; }
      strong { font-size: 18px; }
      p { margin: 4px 0 8px; color: #71717a; font-size: 14px; }
      button { min-width: 150px; border: 1px solid #d4d4d8; border-radius: 7px; background: #fff; color: #27272a; padding: 9px 14px; font-size: 13px; font-weight: 600; }
      button:hover { background: #f4f4f5; }
      @media (prefers-color-scheme: dark) {
        body { background: #202124; color: #e8eaed; }
        p { color: #9aa0a6; }
        button { border-color: #5f6368; background: #202124; color: #e8eaed; }
        button:hover { background: #303134; }
      }
    </style>
  </head>
  <body>
    <main id="recovery"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
