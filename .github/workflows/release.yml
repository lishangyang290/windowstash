name: Release Windows and macOS
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: macOS-arm64
          - platform: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: Windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            companion/package-lock.json
      - name: Check trigger and declared versions
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_EVENT" == push ]]; then
            [[ "$GITHUB_REF" == refs/tags/* ]]
            [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            VERSION="${GITHUB_REF_NAME#v}"
            test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
            git merge-base --is-ancestor HEAD origin/main
            test -s ".github/release-notes/$GITHUB_REF_NAME.md"
          else
            [[ "$RELEASE_EVENT" == workflow_dispatch || "$RELEASE_EVENT" == pull_request ]]
          fi
          for path in .env companion/.env .output companion/dist companion/src-tauri/target; do
            test ! -e "$path" || { echo "干净 checkout 不应包含：$path" >&2; exit 1; }
          done
          node scripts/validate-release-version.mjs "$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install Extension dependencies
        run: npm ci
      - name: Install Companion dependencies
        working-directory: companion
        run: npm ci
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'stable-x86_64-pc-windows-msvc' || 'stable' }}
          targets: ${{ matrix.target }}
      - name: Check runner architecture and remap Rust paths
        run: |
          set -euo pipefail
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
          node -e 'const fs=require("node:fs"),os=require("node:os"); fs.appendFileSync(process.env.GITHUB_ENV, `RUSTFLAGS=--remap-path-prefix=${os.homedir()}=/workspace\n`, "utf8")'
      - name: Check Git whitespace
        run: git diff --check
      - name: Validate Extension
        run: |
          npm run lint -- --ignore-pattern 'companion/**'
          npm test -- --exclude 'companion/**'
          npm run test:release
          npm run typecheck
          npm run build
      - name: Validate Companion frontend
        working-directory: companion
        run: |
          npm run lint
          npm test
          npm run typecheck
          npm run build
      - name: Build Companion app
        if: runner.os == 'macOS'
        working-directory: companion
        run: npm run tauri:build:mac
      - name: Build Windows Companion
        if: runner.os == 'Windows'
        working-directory: companion
        run: npm run tauri:build:windows
      - name: Validate native bridge
        run: |
          cargo test --locked --manifest-path companion/native-host/Cargo.toml
          cargo test --locked --manifest-path companion/src-tauri/Cargo.toml
          node scripts/verify-native-host-production.mjs
          node scripts/verify-browser-auth.mjs
      - name: Run existing production privacy validation
        run: |
          node scripts/validate-release-build.mjs .output/chrome-mv3 companion/dist
          git diff --check
          git diff --exit-code
      - name: Assemble platform package
        run: node scripts/assemble-release.mjs
      - name: Upload verified platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'release' || 'validation' }}-${{ matrix.artifact }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish complete Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
